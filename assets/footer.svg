<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Samir — building products people can actually use, in Arabic first.">
<title>Samir — building products people can actually use, in Arabic first.</title>
<style>
.fi{animation:fi .9s ease-out both}
.su{animation:su .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fi,.su,.ty{animation:none!important}}
</style>
<defs>
  <linearGradient id="ft-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14100A"/><stop offset="1" stop-color="#0B0906"/></linearGradient>
  <radialGradient id="ft-glow" cx="0.18" cy="0.1" r="0.8"><stop offset="0" stop-color="#8A6A2B" stop-opacity="0.38"/><stop offset="0.55" stop-color="#3D2E14" stop-opacity="0.12"/><stop offset="1" stop-color="#3D2E14" stop-opacity="0"/></radialGradient>
  <linearGradient id="ft-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D4AF63" stop-opacity="0"/><stop offset="0.5" stop-color="#EBD6A3"/><stop offset="1" stop-color="#D4AF63" stop-opacity="0"/></linearGradient>
  <pattern id="ft-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#3D2E14" stroke-width="0.5" opacity="0.45"/></pattern>
  <filter id="ft-blur" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>

<rect x="10.5" y="10.5" width="1179" height="169" rx="20" fill="url(#ft-bg)" stroke="#3D2E14"/><rect x="10" y="10" width="1180" height="170" rx="20" fill="url(#ft-glow)"/><rect x="38" y="10" width="160" height="1.5" fill="#EBD6A3" opacity="0.75"/>
<text x="600" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-style="italic" fill="#EBD6A3" class="su">Samir<tspan fill="#D4AF63"> —</tspan></text>
<text x="600" y="126" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#B8AA8F" class="fi" style="animation-delay:.4s">Building products people can actually use — in Arabic, first.</text>
<rect x="430" y="144" width="340" height="1" fill="url(#ft-line)"/>
<circle cx="600" cy="144" r="3" fill="#EBD6A3"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></circle>

</svg>
