<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Samir Sayed — Full-Stack Engineer, AI Product Builder, RTL-first interfaces. Ismailia, Egypt.">
<title>Samir Sayed — Full-Stack Engineer, AI Product Builder, RTL-first interfaces. Ismailia, Egypt.</title>
<style>
.fi{animation:fi .9s ease-out both}
.su{animation:su .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fi,.su,.ty{animation:none!important}}
</style>
<defs>
  <linearGradient id="hr-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14100A"/><stop offset="1" stop-color="#0B0906"/></linearGradient>
  <radialGradient id="hr-glow" cx="0.18" cy="0.1" r="0.8"><stop offset="0" stop-color="#8A6A2B" stop-opacity="0.38"/><stop offset="0.55" stop-color="#3D2E14" stop-opacity="0.12"/><stop offset="1" stop-color="#3D2E14" stop-opacity="0"/></radialGradient>
  <linearGradient id="hr-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D4AF63" stop-opacity="0"/><stop offset="0.5" stop-color="#EBD6A3"/><stop offset="1" stop-color="#D4AF63" stop-opacity="0"/></linearGradient>
  <pattern id="hr-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#3D2E14" stroke-width="0.5" opacity="0.45"/></pattern>
  <filter id="hr-blur" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>

<rect x="10.5" y="10.5" width="1179" height="419" rx="22" fill="url(#hr-bg)" stroke="#3D2E14"/><rect x="10" y="10" width="1180" height="420" rx="22" fill="url(#hr-glow)"/><rect x="10" y="10" width="1180" height="420" rx="22" fill="url(#hr-grid)" opacity="0.6"/><rect x="38" y="10" width="160" height="1.5" fill="#EBD6A3" opacity="0.75"/>
<g class="fi" style="animation-delay:.1s">
  <rect x="64" y="52" width="268" height="30" rx="15" fill="#0B0906" stroke="#3D2E14"/>
  <circle cx="82" cy="67" r="4" fill="#8A6A2B"/>
  <text x="94" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#B8AA8F" >~/samir $</text><text x="166" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#FBF7EE" >build --arabic-first</text>
  <rect x="320" y="60" width="7" height="14" fill="#EBD6A3"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
</g>
<g class="su" style="animation-delay:.25s">
  <rect x="64" y="113" width="26" height="1.2" fill="#D4AF63"/>
  <text x="100" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#D4AF63" letter-spacing="3.2" text-anchor="start">FULL-STACK · AI PRODUCTS · RTL-FIRST</text>
</g>
<g class="su" style="animation-delay:.4s">
  <text x="62" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="76" fill="#FBF7EE" >Samir</text>
  <text x="62" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-style="italic" fill="#EBD6A3">Sayed<tspan fill="#D4AF63" font-style="normal">.</tspan></text>
</g>
<rect x="64" y="292" width="420" height="3" fill="url(#hr-line)" filter="url(#hr-blur)"><animate attributeName="opacity" values=".4;1;.4" dur="4s" repeatCount="indefinite"/></rect>
<rect x="64" y="293" width="420" height="1" fill="url(#hr-line)"/>
<g class="su" style="animation-delay:.6s">
  <text x="64" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#FBF7EE" letter-spacing="2.4" font-weight="700">FULL-STACK ENGINEER  ·  AI PRODUCT BUILDER  ·  RTL-FIRST INTERFACES</text>
  <text x="64" y="354" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#B8AA8F" font-style="italic">Building products for real people — Arabic first.</text>
</g>
<line x1="64" y1="382" x2="1136" y2="382" stroke="#3D2E14"/>
<text x="64" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#B8AA8F" letter-spacing="3.2" text-anchor="start">FACULTY OF COMMERCE · SUEZ CANAL UNIVERSITY</text>
<text x="1136" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#B8AA8F" letter-spacing="3.2" text-anchor="end">ISMAILIA · EGYPT · عربي / ENGLISH</text>

<g fill="none" stroke="#D4AF63">
  <circle cx="1000" cy="208" r="150" opacity="0.18"/>
  <circle cx="1000" cy="208" r="118" opacity="0.14" stroke-dasharray="2 6">
    <animateTransform attributeName="transform" type="rotate" values="0 1000 208;360 1000 208" dur="80s" repeatCount="indefinite"/>
  </circle>
  <path d="M500 250 C650 250 760 200 852 170" opacity="0.35" stroke-width="1"/>
</g>
<circle r="3" fill="#EBD6A3"><animateMotion dur="14s" repeatCount="indefinite" path="M1150 208 A150 150 0 1 1 850 208 A150 150 0 1 1 1150 208"/></circle>
<circle cx="905" cy="88" r="3" fill="#D4AF63"/><text x="915" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#D4AF63" letter-spacing="2">UI</text><circle cx="1100" cy="124" r="3" fill="#D4AF63"/><text x="1110" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#D4AF63" letter-spacing="2">API</text><circle cx="1112" cy="296" r="3" fill="#D4AF63"/><text x="1122" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#D4AF63" letter-spacing="2">AI</text><circle cx="870" cy="326" r="3" fill="#D4AF63"/><text x="880" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#D4AF63" letter-spacing="2">RTL</text>
<g class="fi" style="animation-delay:.5s">
  <path d="M928 330 V196 A72 72 0 0 1 1072 196 V330 Z" fill="#0B0906" stroke="#8A6A2B" stroke-width="1.2"/>
  <path d="M928 330 V196 A72 72 0 0 1 1072 196 V330 Z" fill="url(#hr-glow)"/>
  <text x="1000" y="268" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-style="italic" fill="#EBD6A3">S</text>
  <text x="1000" y="312" text-anchor="middle" font-family="Tahoma, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#D4AF63" direction="rtl">سمير</text>
  <path d="M916 342 H948 M1052 342 H1084" stroke="#D4AF63" stroke-width="1"/>
</g>

