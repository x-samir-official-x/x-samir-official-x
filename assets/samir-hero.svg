<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="sh-title sh-desc">
  <title id="sh-title">Samir Sayed — Full-Stack Engineer and AI Product Builder</title>
  <desc id="sh-desc">Animated burgundy banner with name, role line, technical grid, orbital geometry and a glowing underline.</desc>
  <defs>
    <linearGradient id="sh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0906"/>
      <stop offset="0.55" stop-color="#14100A"/>
      <stop offset="1" stop-color="#1F180D"/>
    </linearGradient>
    <radialGradient id="sh-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8A6A2B" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#3D2E14" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3D2E14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sh-light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EBD6A3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#EBD6A3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBF7EE"/>
      <stop offset="0.5" stop-color="#EBD6A3"/>
      <stop offset="1" stop-color="#FBF7EE"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0;0.6 0;-0.6 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sh-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF63" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#EBD6A3"/>
      <stop offset="1" stop-color="#D4AF63" stop-opacity="0"/>
    </linearGradient>
    <pattern id="sh-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3D2E14" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <radialGradient id="sh-fade" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="sh-gridmask">
      <rect width="1200" height="420" fill="url(#sh-fade)"/>
    </mask>
    <filter id="sh-blur" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#sh-bg)"/>
  <rect width="1200" height="420" fill="url(#sh-grid)" mask="url(#sh-gridmask)"/>
  <ellipse cx="600" cy="200" rx="520" ry="260" fill="url(#sh-glow)"/>

  <circle cx="0" cy="190" r="260" fill="url(#sh-light)">
    <animate attributeName="cx" values="120;1080;120" dur="16s" repeatCount="indefinite"/>
  </circle>

  <g fill="none" stroke="#D4AF63" stroke-width="1">
    <ellipse cx="1060" cy="250" rx="150" ry="54" opacity="0.28" transform="rotate(-18 1060 250)">
      <animateTransform attributeName="transform" type="rotate" values="-18 1060 250;342 1060 250" dur="60s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1060" cy="250" rx="100" ry="100" opacity="0.18" stroke-dasharray="2 7"/>
    <ellipse cx="140" cy="140" rx="120" ry="42" opacity="0.2" transform="rotate(14 140 140)"/>
  </g>
  <circle r="3.5" fill="#EBD6A3">
    <animateMotion dur="12s" repeatCount="indefinite" path="M1203 204 A150 54 -18 1 1 917 296 A150 54 -18 1 1 1203 204"/>
  </circle>

  <path d="M40 372 H210 L240 346 H360 L384 368 H470" fill="none" stroke="#8A6A2B" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="470" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="470;0;0;470" keyTimes="0;0.4;0.8;1" dur="10s" repeatCount="indefinite"/>
  </path>
  <path d="M1170 46 H1060 L1036 70 H960" fill="none" stroke="#8A6A2B" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="230" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="230;0;0;230" keyTimes="0;0.4;0.8;1" dur="10s" begin="2s" repeatCount="indefinite"/>
  </path>
  <circle cx="470" cy="368" r="3" fill="#D4AF63"/>
  <circle cx="960" cy="70" r="3" fill="#D4AF63"/>

  <text x="600" y="92" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="6" fill="#D4AF63">ISMAILIA · EGYPT</text>

  <text x="600" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="400" letter-spacing="10" fill="url(#sh-text)">SAMIR SAYED</text>

  <rect x="400" y="218" width="400" height="3" fill="url(#sh-line)" filter="url(#sh-blur)" opacity="0.9">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="400" y="219" width="400" height="1.2" fill="url(#sh-line)"/>

  <text x="600" y="268" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2.5" fill="#FBF7EE" opacity="0.92">FULL-STACK ENGINEER  ·  AI PRODUCT BUILDER  ·  RTL-FIRST INTERFACES</text>

  <text x="600" y="312" text-anchor="middle" font-family="Tahoma, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#EBD6A3" opacity="0.85" direction="rtl">بنبني منتجات حقيقية لناس حقيقية — بالعربي الأول</text>
</svg>
