<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Environment Friends: official site of the faculty's environment team at Suez Canal University, content-driven from one config file. HTML, CSS, JavaScript, GitHub Pages.">
<title>Environment Friends: official site of the faculty's environment team at Suez Canal University, content-driven from one config file. HTML, CSS, JavaScript, GitHub Pages.</title>
<style>
