<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="sf-title">
  <title id="sf-title">Footer — Samir Sayed</title>
  <defs>
    <linearGradient id="sf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10070C" stop-opacity="0"/>
      <stop offset="1" stop-color="#190B12"/>
    </linearGradient>
    <linearGradient id="sf-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="120" fill="url(#sf-bg)"/>
  <path d="M0 70 C200 40 400 100 600 70 S1000 40 1200 70" fill="none" stroke="url(#sf-line)" stroke-width="1.5">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0 70 C200 40 400 100 600 70 S1000 40 1200 70;M0 70 C200 100 400 40 600 70 S1000 100 1200 70;M0 70 C200 40 400 100 600 70 S1000 40 1200 70"/>
  </path>
  <circle cx="600" cy="70" r="3" fill="#E5B5C7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="108" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="5" fill="#C77B9B">BUILT IN EGYPT · SHIPPED WITH CARE</text>
</svg>
